# Input parameter file for sleec    

# All parameters are in mks units unless otherwise noted.  

# Optimization Parameters  
optmz_fpm_diameter      : [4.000, 2.500, 6.000]     # Airy units [ini, min, max]
optmz_fpm_od            : [2.652, 1.000, 5.000]     # Optical density
optmz_fpm_cosine_apod   : [0.589, 0.050, 1.000]     # Airy units
optmz_dielectric_dia    : [4.000, 2.500, 6.000]     # Airy units
optmz_dielectric_phase  : [0.200, 1.000, 2.000]     # Radians
optmz_dielectric_apod   : [0.589, 0.589, 0.589]     # Airy units
optmz_lyot_diameter     : [0.706, 0.300, 0.900]     # fraction of pupil diameter
optmz_method            : 'SLSQP'     # 'Nelder', 'L-BFGS-B', 'TNC', 'SLSQP', 'COBYLA'


# Basic Parameters  
wvl:  600e-9  

# Pupil Parameters    
pupil_type: 'circular_clear'  # Geometric type of the pupil
pupil_diamtr: 48e-3  # Pupil diameter 
num_pxl_across: 480  # No. of pixels across the pupil diameter

# DM Parameters
num_acttrs_across: None  # No. of actuators across the pupil diameter.  
    # None means DM surface is directly input without using a 
    # voltage map. 
acttr_pxl_spacing: None  # Pixel sampling of the super-influence function, 
    # normally 10 pixels between adjacent actuators. 
    # None means DM surface is directly input without using a 
    # voltage map. 
    
dm1_vmap: None  # In meters.  
    # None means DM surface is directly input without using a 
    # voltage map. 
    
dm2_vmap: None  # In meters.  
    # None means DM surface is directly input without using a 
    # voltage map. 

inflnc_ftn: None  # The super influence funtion
    # None means DM surface is directly input without using a 
    # voltage map. 
    
dm_seprtn: 1.0  # Physical separation between the two DMs  

# Focal Plane Parameters  
f_num:  30.0  # f/#
num_airy: 28  # Outer extent in terms of Airy rings
fpm_diamtr: 5.94098759e-05  # Diameter of the focal-plane mask
oversmpl: 4  # No. of pixles per resolution width
    
# Lyot Plane Parameters   
lyot_type:  'circular_clear'  # Geometric type of the Lyot aperture   
lyot_dia: 2.80100555e-02  # Lyot aperture  diameter
    
# Image Plane Parameters
dark_zone_type: 'annular_full'
iwa: 3.0  # Inner working angle (for contrast calculation).  
    # In units of f_num*wvl
owa: 16*f_num*pars['wvl']  # Outer working angle.  
    # In units of f_num*wvl
